    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        links:
            - mysql:mysql
        ports:
            - 8080:80
        environment:
            MYSQL_USERNAME: "${DB_USERNAME}"
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
            PMA_HOST: mysql
        networks:
            - sail

    nginx:
        build:
            context: "./docker/nginx"
        depends_on:
            - php-fpm
        volumes:
            - ${NGINX_SSL_PATH}:/etc/nginx/ssl
            - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
            - ${NGINX_HOST_LOG_PATH}:/var/log/nginx
            - ${NGINX_SITES_PATH}:/etc/nginx/sites-available
        ports:
            # port mappings, host to docker
            - "${NGINX_HOST_HTTPS_PORT}:443"
            - "${NGINX_HOST_HTTP_PORT}:80"
        networks:
            - sail

    php-fpm:
        build:
            context: "./docker/php-fpm"
            args:
                WWWGROUP: '${WWWGROUP}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        ports:
            - "6001:6001"
        volumes:
            -   ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
        networks:
            - sail
        expose:
            - "9000"
        depends_on:
            - mysql

    oven-media-engine:
        build:
            context: "./docker/ovenmediaengine"
        environment:
            - OME_HOST_IP=localhost
            - OME_ORIGIN_PORT=9000
            - OME_RTMP_PROV_PORT=1935
            - OME_SRT_PROV_PORT=9999
            - OME_LLHLS_STREAM_PORT=3333
            - OME_WEBRTC_SIGNALLING_PORT=3333
            - OME_WEBRTC_TCP_RELAY_PORT=3478
            - OME_WEBRTC_CANDIDATE_PORT=10000-10004/udp
        volumes:
            - ${OME_CONFIG}:/opt/ovenmediaengine/bin/origin_conf
        ports:
            - "8081:8081/tcp" # API
            - "9000:9000/tcp" # OVT(Origin)
            - "1935:1935/tcp" # RTMP Provider
            - "9999:9999/udp" # SRT
            - "3333:3333/tcp" # WebRTC Signaling / LLHLS
            - "3478:3478/tcp" # WebRTC TURN
            - "10000-10004:10000-10004/udp" # WebRTC Candidate
        restart: always
        command: /opt/ovenmediaengine/bin/OvenMediaEngine -c origin_conf
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
        driver: local
