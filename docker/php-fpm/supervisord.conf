# [program:websockets]
# command=/usr/local/bin/php /var/www/html/artisan websockets:serve
# numprocs=1
# autostart=true
# autorestart=true
# user=sail

[program:reverb]
command=/usr/local/bin/php /var/www/html/artisan reverb:start --port=6001
numprocs=1
autostart=true
autorestart=true
user=sail
minfds=10000

[program:laravel-queue-tarnsport-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/php /var/www/html/artisan queue:work --queue=high,transports,low --tries=3 --backoff=3 --timeout=30 --sleep=3
numprocs=4
autostart=true
autorestart=true
user=sail
stopwaitsecs=3600
stopasgroup=true
killasgroup=true

[program:laravel-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/php /var/www/html/artisan queue:work --tries=3 --backoff=3 --timeout=30 --sleep=3
numprocs=4
autostart=true
autorestart=true
user=sail
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
